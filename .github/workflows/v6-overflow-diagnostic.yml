name: V6 Overflow Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [v6-spline-ci]
    paths:
      - '.github/workflows/v6-overflow-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Decode and patch V6 snapshot
        run: |
          rm -rf ci-v6 && mkdir ci-v6
          cat ci/v6-source.00.part ci/v6-source.01.part ci/v6-source.02.part ci/v6-source.03.part ci/v6-source.04.part ci/v6-source.05.part | base64 -d > /tmp/v6.tar.xz
          tar -xJf /tmp/v6.tar.xz -C ci-v6
          cd ci-v6
          patch -p1 < ../ci/v6-final-fixes.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: ci-v6
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: ci-v6
        run: npm run build
      - name: Install Chromium
        working-directory: ci-v6
        run: npx playwright install --with-deps chromium
      - name: Write diagnostic test
        working-directory: ci-v6
        run: |
          cat > tests/overflow-debug.spec.js <<'EOF'
          import { test } from '@playwright/test'

          const inspect = async (page, width, height, label) => {
            await page.setViewportSize({ width, height })
            await page.goto('/?quality=low')
            await page.waitForTimeout(900)
            const result = await page.evaluate(() => {
              const de = document.documentElement
              const body = document.body
              const root = document.querySelector('#root')
              const nodes = [de, body, root, ...document.querySelectorAll('body *')].filter(Boolean)
              const shape = el => {
                const r = el.getBoundingClientRect()
                const cs = getComputedStyle(el)
                return {
                  tag: el.tagName,
                  cls: typeof el.className === 'string' ? el.className.slice(0,120) : '',
                  id: el.id,
                  clientWidth: el.clientWidth,
                  scrollWidth: el.scrollWidth,
                  delta: el.scrollWidth - el.clientWidth,
                  left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width),
                  position: cs.position, transform: cs.transform, overflowX: cs.overflowX,
                  text: (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,80),
                }
              }
              const outward = nodes.map(shape).filter(x => x.right > de.clientWidth + 1 || x.left < -1)
                .sort((a,b) => Math.max(b.right-de.clientWidth,-b.left)-Math.max(a.right-de.clientWidth,-a.left)).slice(0,30)
              const internal = nodes.map(shape).filter(x => x.delta > 1)
                .sort((a,b) => b.delta-a.delta).slice(0,40)
              const pseudo = (el, selector) => {
                const s = getComputedStyle(el, selector)
                return { content:s.content, position:s.position, left:s.left, right:s.right, width:s.width, transform:s.transform }
              }
              return {
                vw: de.clientWidth,
                sw: de.scrollWidth,
                overflow: de.scrollWidth-de.clientWidth,
                body: shape(body), root: shape(root),
                outward, internal,
                bodyBefore:pseudo(body,'::before'), bodyAfter:pseudo(body,'::after')
              }
            })
            console.log(`DIAG ${label} ${JSON.stringify(result,null,2)}`)
          }

          test('report patched internal scrollWidth owners', async ({ page }) => {
            await inspect(page, 1440, 900, 'desktop')
            await inspect(page, 390, 844, 'mobile')
          })
          EOF
      - name: Run diagnostics
        working-directory: ci-v6
        run: npx playwright test tests/overflow-debug.spec.js --project=chromium --workers=1
