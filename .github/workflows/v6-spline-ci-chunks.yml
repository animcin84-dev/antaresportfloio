name: V6 Spline CI Chunks

on:
  push:
    branches: [v6-spline-ci]
  workflow_dispatch:

jobs:
  verify-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Decode V6 source snapshot
        run: |
          rm -rf ci-v6
          mkdir -p ci-v6
          cat ci/v6-source.00.part ci/v6-source.01.part ci/v6-source.02.part ci/v6-source.03.part ci/v6-source.04.part ci/v6-source.05.part | base64 -d > /tmp/v6-source.tar.xz
          tar -xJf /tmp/v6-source.tar.xz -C ci-v6
          test -f ci-v6/package.json
          test -f ci-v6/src/components/SplineHero.jsx
          touch ci-v6/SUBMISSION-PACK.md ci-v6/CREDITS.md ci-v6/JURY-AUDIT.md ci-v6/FINAL-QA.md

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin portable verification dependencies
        working-directory: ci-v6
        run: |
          npm pkg set dependencies.@splinetool/runtime=1.12.98
          npm pkg set devDependencies.typescript=5.9.3

      - name: Install dependencies
        working-directory: ci-v6
        run: npm install --no-audit --no-fund

      - name: Static contract
        working-directory: ci-v6
        run: npm run audit:static

      - name: Syntax checks
        working-directory: ci-v6
        run: |
          node scripts/jsx-syntax-check.cjs
          node --check tests/structure.spec.js
          node --check tests/smoke.spec.js

      - name: Apply canonical JSX extension fix
        working-directory: ci-v6
        run: mv src/i18n.js src/i18n.jsx

      - name: Create lightweight media fixtures for browser-only snapshot
        working-directory: ci-v6
        env:
          JPG_FIXTURE: 
        run: |
          mkdir -p public/assets
          for f in abai-bol-logo.jpg cad-black-purple.jpg cad-top.jpg robot-centerstage.jpg robot-into-deep.jpg robot-prototype.jpg team-almaty-2025.jpg team-bishkek-award.jpg team-bishkek.jpg team-daryn.jpg team-indonesia-award.jpg team-indonesia-field.jpg team-lepsi.jpg team-outdoors.jpg; do
            printf '%s' "$JPG_FIXTURE" | base64 -d > "public/assets/$f"
          done

      - name: Production build
        working-directory: ci-v6
        run: npm run build

      - name: Install Chromium
        working-directory: ci-v6
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        working-directory: ci-v6
        run: npx playwright test --project=chromium
