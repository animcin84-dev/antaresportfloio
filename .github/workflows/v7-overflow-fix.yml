name: V7 Export Overflow Root Fixes

on:
  push:
    branches: [v7-engineering-memory]
    paths: ['.github/workflows/v7-overflow-fix.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verification dependencies
        run: npm ci --no-audit --no-fund
      - name: Patch remaining overflow roots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles.css')
          s = p.read_text()
          pairs = [
            ('.mission-v7-pin{position:sticky;top:0;height:100svh;overflow:hidden}',
             '.mission-v7-pin{position:sticky;top:0;height:100svh;overflow:clip;contain:paint}'),
            ('.machine-heading{grid-template-columns:1fr;min-height:58vh}',
             '.machine-heading{grid-template-columns:minmax(0,1fr);min-height:58vh}'),
          ]
          for old, new in pairs:
            if old not in s:
              raise SystemExit(f'Expected CSS pattern missing: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          npm run test:structure
          node scripts/jsx-syntax-check.cjs
          git diff --check
          git diff -- src/styles.css
          sha256sum src/styles.css > fixed-styles.sha256
      - name: Upload verified stylesheet
        uses: actions/upload-artifact@v4
        with:
          name: v7-fixed-styles
          path: |
            src/styles.css
            fixed-styles.sha256
          if-no-files-found: error
          retention-days: 7
