name: V7 Recover Bootstrap Archives

on:
  push:
    branches: [v7-engineering-memory]
    paths:
      - '.github/workflows/v7-recover.yml'
      - 'ci/v7-bootstrap/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat ci/v7-bootstrap/source.00a.b64
            tail -c +8001 ci/v7-bootstrap/source.00.b64
            cat ci/v7-bootstrap/source.01.b64
            cat ci/v7-bootstrap/source.02.b64
            cat ci/v7-bootstrap/source.03a.b64
            cat ci/v7-bootstrap/source.03b.b64
            cat ci/v7-bootstrap/source.04.b64
          } | base64 -d > /tmp/v7-source.tar.gz
          echo 'a29c67812d9817c323db36cfde75c5f33d56402704b87e7cb80d8b91d03644ce  /tmp/v7-source.tar.gz' | sha256sum -c -
          gzip -t /tmp/v7-source.tar.gz
          tar -tzf /tmp/v7-source.tar.gz > /tmp/source-files.txt
          test "$(wc -l < /tmp/source-files.txt)" -eq 53
          grep -E '(^|/)package.json$' /tmp/source-files.txt
          grep -E '(^|/)src/App.jsx$' /tmp/source-files.txt
          grep -E '(^|/)\.github/workflows/v7-quality.yml$' /tmp/source-files.txt
          mkdir -p recovered
          cp /tmp/v7-source.tar.gz recovered/
          cp /tmp/source-files.txt recovered/

      - name: Compare every media chunk to canonical manifest
        shell: bash
        run: |
          set -u
          mismatches=0
          while read -r expected_sha expected_len name; do
            path="ci/v7-bootstrap/$name"
            actual_len=$(wc -c < "$path")
            actual_sha=$(git hash-object "$path")
            if [ "$actual_len" != "$expected_len" ] || [ "$actual_sha" != "$expected_sha" ]; then
              echo "MISMATCH $name expected_len=$expected_len actual_len=$actual_len expected_sha=$expected_sha actual_sha=$actual_sha"
              mismatches=$((mismatches+1))
            else
              echo "OK $name"
            fi
          done < ci/v7-bootstrap/media-manifest.txt
          echo "MEDIA_CHUNK_MISMATCHES=$mismatches"
          test "$mismatches" -eq 0

      - name: Reconstruct verified media archive
        shell: bash
        run: |
          set -euo pipefail
          {
            for f in ci/v7-bootstrap/media.{00..13}.b64; do cat "$f"; done
            for f in ci/v7-bootstrap/t7.{000..028}.b64; do cat "$f"; done
            cat ci/v7-bootstrap/t7.029.b64
          } > /tmp/v7-media.b64
          test "$(wc -c < /tmp/v7-media.b64)" -eq 362472
          base64 -d /tmp/v7-media.b64 > /tmp/v7-media.tar.gz
          echo '09e1cfd374b6cbbb4ccb9ebb49b08d6fb2a449e9384aaeca5d0b459a3fee735c  /tmp/v7-media.tar.gz' | sha256sum -c -
          gzip -t /tmp/v7-media.tar.gz
          tar -tzf /tmp/v7-media.tar.gz > /tmp/media-files.txt
          test "$(grep -c '\.avif$' /tmp/media-files.txt)" -eq 7
          cp /tmp/v7-media.tar.gz recovered/
          cp /tmp/media-files.txt recovered/

      - name: Package recovered archives
        if: always()
        shell: bash
        run: |
          if [ -d recovered ]; then sha256sum recovered/* > recovered/SHA256SUMS.txt || true; fi

      - name: Upload recovered archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-recovered-bootstrap
          path: recovered/
          if-no-files-found: error
          retention-days: 1
