name: V7 Recover Bootstrap Archives

on:
  push:
    branches: [v7-engineering-memory]
    paths:
      - '.github/workflows/v7-recover.yml'
      - 'ci/v7-bootstrap/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat ci/v7-bootstrap/source.00a.b64
            tail -c +8001 ci/v7-bootstrap/source.00.b64
            cat ci/v7-bootstrap/source.01.b64
            cat ci/v7-bootstrap/source.02.b64
            cat ci/v7-bootstrap/source.03a.b64
            cat ci/v7-bootstrap/source.03b.b64
            cat ci/v7-bootstrap/source.04.b64
          } | base64 -d > /tmp/v7-source.tar.gz
          echo 'a29c67812d9817c323db36cfde75c5f33d56402704b87e7cb80d8b91d03644ce  /tmp/v7-source.tar.gz' | sha256sum -c -
          gzip -t /tmp/v7-source.tar.gz
          tar -tzf /tmp/v7-source.tar.gz > /tmp/source-files.txt
          test "$(wc -l < /tmp/source-files.txt)" -eq 53
          grep -E '(^|/)package.json$' /tmp/source-files.txt
          grep -E '(^|/)src/App.jsx$' /tmp/source-files.txt
          grep -E '(^|/)\.github/workflows/v7-quality.yml$' /tmp/source-files.txt
          mkdir -p recovered
          cp /tmp/v7-source.tar.gz recovered/
          cp /tmp/source-files.txt recovered/

      - name: Verify canonical media chunks and corrections
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected_sha expected_len name; do
            case "$name" in
              t7.004.b64|t7.028.b64) continue ;;
            esac
            path="ci/v7-bootstrap/$name"
            test "$(wc -c < "$path")" -eq "$expected_len"
            test "$(git hash-object "$path")" = "$expected_sha"
          done < ci/v7-bootstrap/media-manifest.txt
          test "$(wc -c < ci/v7-bootstrap/t7.004.fix-a.b64)" -eq 4000
          test "$(git hash-object ci/v7-bootstrap/t7.004.fix-a.b64)" = '0c746d5ecc24022c5c1cc22f6727f9e639b3c0e7'
          test "$(wc -c < ci/v7-bootstrap/t7.004.fix-b.b64)" -eq 3000
          test "$(git hash-object ci/v7-bootstrap/t7.004.fix-b.b64)" = 'ce8a62f2263bcdd171efdfa85db151f367843cae'
          test "$(wc -c < ci/v7-bootstrap/t7.028.fix-a.b64)" -eq 4000
          test "$(git hash-object ci/v7-bootstrap/t7.028.fix-a.b64)" = '023819fc46f42438d1558eb6e18c01c3ba598114'
          test "$(wc -c < ci/v7-bootstrap/t7.028.fix-b.b64)" -eq 3000
          test "$(git hash-object ci/v7-bootstrap/t7.028.fix-b.b64)" = '5cc85066dbc602aab8df6c045b81f9858bc7fc20'
          echo 'All canonical media chunks/corrections match the Drive reference.'

      - name: Reconstruct verified media archive
        shell: bash
        run: |
          set -euo pipefail
          {
            for f in ci/v7-bootstrap/media.{00..13}.b64; do cat "$f"; done
            for i in 000 001 002 003; do cat "ci/v7-bootstrap/t7.$i.b64"; done
            cat ci/v7-bootstrap/t7.004.fix-a.b64 ci/v7-bootstrap/t7.004.fix-b.b64
            for i in $(seq -w 5 27); do cat "ci/v7-bootstrap/t7.0$i.b64"; done
            cat ci/v7-bootstrap/t7.028.fix-a.b64 ci/v7-bootstrap/t7.028.fix-b.b64
            cat ci/v7-bootstrap/t7.029.b64
          } > /tmp/v7-media.b64
          test "$(wc -c < /tmp/v7-media.b64)" -eq 362472
          base64 -d /tmp/v7-media.b64 > /tmp/v7-media.tar.gz
          echo '09e1cfd374b6cbbb4ccb9ebb49b08d6fb2a449e9384aaeca5d0b459a3fee735c  /tmp/v7-media.tar.gz' | sha256sum -c -
          gzip -t /tmp/v7-media.tar.gz
          tar -tzf /tmp/v7-media.tar.gz > /tmp/media-files.txt
          cat /tmp/media-files.txt
          test "$(grep -c '\.avif$' /tmp/media-files.txt)" -eq 7
          cp /tmp/v7-media.tar.gz recovered/
          cp /tmp/media-files.txt recovered/

      - name: Package recovered archives
        shell: bash
        run: sha256sum recovered/* > recovered/SHA256SUMS.txt

      - name: Upload recovered archives
        uses: actions/upload-artifact@v4
        with:
          name: v7-recovered-bootstrap
          path: recovered/
          if-no-files-found: error
          retention-days: 1
