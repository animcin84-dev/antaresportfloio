name: ABAI BOL build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency inventory
        run: npm list --depth=0
      - name: Production dependency audit
        run: npm audit --omit=dev || true
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --port 4173 > /tmp/abai-bol-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/abai-bol-vite.log
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        id: smoke
        continue-on-error: true
        run: npm run test:smoke 2>&1 | tee /tmp/abai-bol-smoke.log
      - name: Comment smoke diagnostics on PR
        if: steps.smoke.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### V3 browser smoke-test diagnostics'
            echo
            echo '```text'
            tail -n 140 /tmp/abai-bol-smoke.log
            echo '```'
          } > /tmp/smoke-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/smoke-comment.md
      - name: Capture visual QA
        if: always()
        run: |
          mkdir -p visual-qa
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --full-page --wait-for-timeout=4500 http://127.0.0.1:4173 visual-qa/abai-bol-v3-desktop.png || true
          npx playwright screenshot --browser chromium --viewport-size="390,844" --full-page --wait-for-timeout=4500 http://127.0.0.1:4173 visual-qa/abai-bol-v3-mobile.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abai-bol-v3-visual-qa
          path: |
            visual-qa/
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail CI if browser smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
